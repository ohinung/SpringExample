<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Thymeleaf 변수와 조건문</title>
</head>
<body>
	<h2>Thymeleaf 변수와 조건문</h2>
	
	<h3>1.변수</h3>
	<div th:with="number = 100">
		<h4 th:text="${number}"></h4>
	</div>
	
	<!--변수가 선언된 하위 태그에서만 사용가능 -->
	<h4 th:text="${number}"></h4>

	<h3>2.태그 없이 thymeleaf 활용</h3>
	<!-- block 태그는 최종결과 html에 포함되지 않는다. 
		 block 태그는 랜더링 되지 않는다.랜더링이란 특정 태그가 보여지냐 안보여지냐를 말함.-->
	<th:block th:with="number1 = 200, number2 = 300">
		<h4 th:text="${number1}"></h4>
		<h4 th:text="${number1 + number2}"></h4>
		<!-- 결과 : 500 -->
		<h4 th:text="'결과 : ' + ${number1+number2}"></h4>
		<h4 th:text="|결과 : ${number1 + number2}|"></h4>
	</th:block>
	
	<h3>3. 태그 나타내기</h3>
	<!--  html escape : 태그 기능이 적용되지 않도록 특수문자로 태그를 바꿔버림. -->
	<div th:text = "'<b>진한글씨</b>'"> </div>
	<div th:utext = "'<b>진한글씨</b>'"> </div>
	
	
	<h4>4.조건문</h4>
	<th:block th:with="age=30">
		<!-- if 속성일 때는 값이 true일 때 해당 태그가 렌더링 된다 -->
		<!-- 15보다 크면 태그 보여주기 -->
		<h3 th:if="${age >= 15}">15살 이상입니다.</h3>
		
		
		<h4 th:if="${age >= 20}">성인입니다.</h4>
		
		<!--  unless 속성일때는 값이 false일 때 해당 태그가 렌더링 된다. -->
		<h4 th:unless="${age >= 20}">미성년입니다.</h4>
	</th:block>
	
	<h3>5. switch문</h3>
	<th:block th:with="season='겨울'">
	<!-- 봄일 때는 따듯하다. 여름일 때는 덥다 가을일 때는 시원하다. 겨울일떄는 춥다 -->
	<div th:switch="${season}">
	<h4 th:case="봄">따듯하다.</h4>
	<h4 th:case="여름">덥다</h4>
	<h4 th:case="가을">시원하다.</h4>
	<h4 th:case="겨울">춥다.</h4>
	<h4 th:case="*">계절이 아닙니다.</h4>
	</div>	
	</th:block>


</body>
</html>
